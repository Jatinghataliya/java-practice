server:
  port: 8080

debug: false

logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure: INFO
    org.springframework.boot.autoconfigure.logging: INFO
    org.springframework: INFO
    org.hibernate: INFO
    com.example.excelexport: INFO

spring:
  application:
    name: excel-export-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CACHE_SIZE=65536}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          fetch_size: 2000
          batch_size: 1000
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cluster:
    redis:
      enabled: ${APP_CLUSTER_REDIS_ENABLED:false}

  storage:
    type: local # Options: local | s3 | minio | azure | gcs
    s3:
      bucket-name: my-export-bucket
      region: us-east-1
      access-key:
      secret-key:
    minio:
      endpoint: http://localhost:9000
      bucket-name: export-bucket
      access-key: minioadmin
      secret-key: minioadmin
    azure:
      connection-string:
      container-name: export-container
    gcs:
      bucket-name: my-gcs-export-bucket

  export:
    storage-dir: ./temp-exports
    batch-fetch-size: 2000
    rows-per-sheet: 1000000
    seed-sample-records: 50000
    thread-pool:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 50
      thread-name-prefix: "ExcelExport-"
