events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format upstream_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           'upstream: $upstream_addr response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log upstream_log;

    # Upstream cluster pool of Spring Boot Export Service nodes
    upstream excel_app_cluster {
        least_conn;
        server excel-export-service-1:8080 max_fails=3 fail_timeout=10s;
        server excel-export-service-2:8080 max_fails=3 fail_timeout=10s;
        server excel-export-service-3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # Healthcheck endpoint for Load Balancer
        location /lb-health {
            access_log off;
            return 200 "Load Balancer Healthy\n";
        }

        # Dedicated Server-Sent Events (SSE) Proxying with zero buffering
        location /api/v1/exports/notifications/sse/ {
            proxy_pass http://excel_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Crucial SSE configuration to prevent proxy buffer stall
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            add_header X-Served-By $upstream_addr always;
        }

        # General REST API Load Balancing
        location / {
            proxy_pass http://excel_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Identify which application instance processed the request
            add_header X-Served-By $upstream_addr always;
        }
    }
}
