services:
  # -----------------------------------------------------------
  # Spring Boot Excel Export Service (Self-contained)
  # -----------------------------------------------------------
  excel-export-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excel-export-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - APP_STORAGE_TYPE=local
      - APP_EXPORT_STORAGE_DIR=/app/temp-exports
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    volumes:
      - app-temp-exports:/app/temp-exports
    restart: unless-stopped
    networks:
      - export-network

volumes:
  app-temp-exports:

networks:
  export-network:
    driver: bridge
